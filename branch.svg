<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 280 42"
     width="280" height="42">

  <defs>
    <!-- Цвет лепестков -->
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E9"/>
      <stop offset="100%" stop-color="#E9D7BB"/>
    </linearGradient>

    <!-- Лист -->
    <g id="leaf">
      <path d="M0 0 Q-8 -12 -18 -7 Q-14 2 0 0Z"
            fill="#78856B"/>
      <path d="M0 0 Q-10 -5 -16 -7"
            fill="none"
            stroke="#D8C5A5"
            stroke-width="0.55"/>
    </g>

    <!-- Маленький цветок -->
    <g id="flower">
      <g fill="url(#petal)"
         stroke="#B8A58A"
         stroke-width="0.65">
        <ellipse cx="0" cy="-3.5" rx="2.1" ry="3.1"/>
        <ellipse cx="0" cy="-3.5" rx="2.1" ry="3.1"
                 transform="rotate(72)"/>
        <ellipse cx="0" cy="-3.5" rx="2.1" ry="3.1"
                 transform="rotate(144)"/>
        <ellipse cx="0" cy="-3.5" rx="2.1" ry="3.1"
                 transform="rotate(216)"/>
        <ellipse cx="0" cy="-3.5" rx="2.1" ry="3.1"
                 transform="rotate(288)"/>
      </g>
      <circle r="1.3" fill="#B8A58A"/>
    </g>
  </defs>

  <!-- Изящный изогнутый стебель -->
  <path d="M9 28
           C47 31 67 14 104 18
           S161 30 192 23
           S238 11 271 13"
        fill="none"
        stroke="#66765D"
        stroke-width="1.15"
        stroke-linecap="round"/>

  <!-- Листья слева -->
  <use href="#leaf" transform="translate(30 29) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(47 26) rotate(150) scale(.75)"/>
  <use href="#leaf" transform="translate(65 20) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(82 17) rotate(150) scale(.75)"/>

  <!-- Листья в центре -->
  <use href="#leaf" transform="translate(111 20) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(130 22) rotate(150) scale(.75)"/>
  <use href="#leaf" transform="translate(151 27) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(171 27) rotate(150) scale(.75)"/>

  <!-- Листья справа -->
  <use href="#leaf" transform="translate(199 21) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(218 17) rotate(150) scale(.75)"/>
  <use href="#leaf" transform="translate(239 13) rotate(-35) scale(.8)"/>
  <use href="#leaf" transform="translate(256 13) rotate(150) scale(.75)"/>

  <!-- Кремовые цветочки -->
  <use href="#flower" transform="translate(56 15) scale(.9)"/>
  <use href="#flower" transform="translate(99 12) scale(.8)"/>
  <use href="#flower" transform="translate(183 18) scale(.95)"/>
  <use href="#flower" transform="translate(233 8) scale(.85)"/>

  <!-- Золотистые точки -->
  <g fill="#D8C5A5">
    <circle cx="20" cy="20" r="1.1"/>
    <circle cx="75" cy="31" r="1.1"/>
    <circle cx="143" cy="13" r="1.1"/>
    <circle cx="211" cy="29" r="1.1"/>
    <circle cx="266" cy="24" r="1.1"/>
  </g>

</svg>
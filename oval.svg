<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 600 260"
    width="600"
    height="260"
>
    <defs>
        <linearGradient id="frameColor" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D8C5A5"/>
            <stop offset="50%" stop-color="#B8A58A"/>
            <stop offset="100%" stop-color="#D8C5A5"/>
        </linearGradient>
    </defs>

    <!-- Внешняя овальная рамка -->
    <ellipse
        cx="300"
        cy="130"
        rx="275"
        ry="105"
        fill="none"
        stroke="url(#frameColor)"
        stroke-width="2"
    />

    <!-- Внутренняя тонкая линия -->
    <ellipse
        cx="300"
        cy="130"
        rx="268"
        ry="98"
        fill="none"
        stroke="#B8A58A"
        stroke-width="0.7"
        opacity="0.65"
    />
</svg>
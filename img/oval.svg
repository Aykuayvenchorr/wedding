<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 300"
     width="600" height="300">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C5A5"/>
      <stop offset="50%" stop-color="#B8A58A"/>
      <stop offset="100%" stop-color="#D8C5A5"/>
    </linearGradient>

    <g id="leaf">
      <path d="M0 0 Q-12 -14 -23 -8 Q-17 3 0 0Z"
            fill="#78856B" stroke="#66765D" stroke-width="0.7"/>
      <path d="M0 0 Q-13 -10 -21 -8"
            fill="none" stroke="#D8C5A5" stroke-width="0.6"/>
    </g>

    <g id="flower">
      <g fill="#F0DFC8" stroke="#B8A58A" stroke-width="0.8">
        <ellipse cx="0" cy="-6" rx="3.2" ry="5"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5"
                 transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5"
                 transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5"
                 transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5"
                 transform="rotate(288)"/>
      </g>
      <circle r="2.2" fill="#B8A58A"/>
    </g>
  </defs>

  <!-- Основная двойная рамка -->
  <ellipse cx="300" cy="150" rx="272" ry="105"
           fill="none" stroke="url(#gold)" stroke-width="2"/>
  <ellipse cx="300" cy="150" rx="265" ry="98"
           fill="none" stroke="#B8A58A"
           stroke-width="0.7" opacity="0.7"/>

  <!-- Верхняя веточка слева -->
  <g fill="none" stroke="#78856B" stroke-width="1.4"
     stroke-linecap="round">
    <path d="M35 137 Q65 83 120 62 Q165 47 205 57"/>
    <path d="M395 57 Q445 43 480 67 Q530 90 562 137"/>
  </g>

  <g>
    <use href="#leaf" transform="translate(65 91) rotate(-35)"/>
    <use href="#leaf" transform="translate(91 75) rotate(20)"/>
    <use href="#leaf" transform="translate(119 64) rotate(-28)"/>
    <use href="#leaf" transform="translate(146 55) rotate(20)"/>
    <use href="#leaf" transform="translate(176 54) rotate(-25)"/>
    <use href="#leaf" transform="translate(204 57) rotate(25)"/>

    <use href="#leaf" transform="translate(535 91) rotate(210)"/>
    <use href="#leaf" transform="translate(509 75) rotate(160)"/>
    <use href="#leaf" transform="translate(481 64) rotate(208)"/>
    <use href="#leaf" transform="translate(454 55) rotate(160)"/>
    <use href="#leaf" transform="translate(424 54) rotate(205)"/>
    <use href="#leaf" transform="translate(396 57) rotate(155)"/>
  </g>

  <!-- Цветы сверху -->
  <use href="#flower" transform="translate(108 69) scale(0.9)"/>
  <use href="#flower" transform="translate(184 55) scale(0.75)"/>
  <use href="#flower" transform="translate(492 69) scale(0.9)"/>
  <use href="#flower" transform="translate(416 55) scale(0.75)"/>

  <!-- Нижние веточки -->
  <g fill="none" stroke="#78856B" stroke-width="1.4"
     stroke-linecap="round">
    <path d="M35 163 Q65 217 120 238 Q165 253 205 243"/>
    <path d="M395 243 Q445 257 480 233 Q530 210 562 163"/>
  </g>

  <g>
    <use href="#leaf" transform="translate(65 209) rotate(35)"/>
    <use href="#leaf" transform="translate(91 225) rotate(200)"/>
    <use href="#leaf" transform="translate(119 236) rotate(28)"/>
    <use href="#leaf" transform="translate(146 245) rotate(200)"/>
    <use href="#leaf" transform="translate(176 246) rotate(25)"/>
    <use href="#leaf" transform="translate(204 243) rotate(205)"/>

    <use href="#leaf" transform="translate(535 209) rotate(145)"/>
    <use href="#leaf" transform="translate(509 225) rotate(-20)"/>
    <use href="#leaf" transform="translate(481 236) rotate(152)"/>
    <use href="#leaf" transform="translate(454 245) rotate(-20)"/>
    <use href="#leaf" transform="translate(424 246) rotate(155)"/>
    <use href="#leaf" transform="translate(396 243) rotate(-25)"/>
  </g>

  <!-- Цветы снизу -->
  <use href="#flower" transform="translate(108 231) scale(0.9)"/>
  <use href="#flower" transform="translate(184 245) scale(0.75)"/>
  <use href="#flower" transform="translate(492 231) scale(0.9)"/>
  <use href="#flower" transform="translate(416 245) scale(0.75)"/>

  <!-- Маленькие золотистые точки -->
  <g fill="#D8C5A5">
    <circle cx="72" cy="119" r="2"/>
    <circle cx="143" cy="74" r="1.8"/>
    <circle cx="528" cy="119" r="2"/>
    <circle cx="457" cy="74" r="1.8"/>
    <circle cx="72" cy="181" r="2"/>
    <circle cx="143" cy="226" r="1.8"/>
    <circle cx="528" cy="181" r="2"/>
    <circle cx="457" cy="226" r="1.8"/>
  </g>

</svg>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 120 120"
    width="120"
    height="120"
    fill="none"
>

    <!-- Центральный круг -->
    <circle
        cx="60"
        cy="60"
        r="10"
        fill="#f3e4d0"
        fill-opacity="0.8"
    />

    <!-- Внутреннее кольцо -->
    <circle
        cx="60"
        cy="60"
        r="24"
        stroke="#f3e4d0"
        stroke-width="2"
        stroke-opacity="0.55"
    />

    <!-- Внешнее кольцо -->
    <circle
        cx="60"
        cy="60"
        r="39"
        stroke="#f3e4d0"
        stroke-width="2"
        stroke-opacity="0.3"
    />

</svg>
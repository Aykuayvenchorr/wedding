<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1200 650"
    preserveAspectRatio="none"
>
    <defs>

        <!-- Яркое тёплое свечение -->
        <radialGradient id="warmLight" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="18%" stop-color="#FFFDF0"/>
            <stop offset="38%" stop-color="#FFF3BE"/>
            <stop offset="58%" stop-color="#FFE08A" stop-opacity="0.95"/>
            <stop offset="78%" stop-color="#F6C75F" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#F6C75F" stop-opacity="0"/>
        </radialGradient>

        <!-- Большой мягкий ореол -->
        <filter
            id="softGlow"
            x="-250%"
            y="-250%"
            width="600%"
            height="600%"
        >
            <feGaussianBlur stdDeviation="6"/>
        </filter>

        <!-- Одна лампочка -->
        <g id="bulb">

            <!-- Провод к лампочке -->
            <path
                d="M 0,0 C -1,9 2,16 0,24"
                fill="none"
                stroke="#EEE5D5"
                stroke-width="1"
                stroke-linecap="round"
            />

            <!-- Патрон -->
            <rect
                x="-3.5"
                y="22"
                width="3"
                height="2"
                rx="1.5"
                fill="#D9CFBB"
            />

            <!-- Большое мягкое свечение -->
            <circle
                cx="0"
                cy="30"
                r="10"
                fill="#FFD96F"
                opacity="0.48"
                filter="url(#softGlow)"
            />

            <!-- Основное свечение -->
            <circle
                cx="0"
                cy="23"
                r="5"
                fill="url(#warmLight)"
            />

            <!-- Яркое ядро -->
            <ellipse
                cx="0"
                cy="23"
                rx="4"
                ry="5.5"
                fill="#FFFDF0"
            />

            <!-- Блик -->
            <ellipse
                cx="-1"
                cy="20"
                rx="1.6"
                ry="2"
                fill="#FFFFFF"
            />

        </g>

    </defs>


    <!-- ================================================= -->
    <!-- ВСЯ ГИРЛЯНДА -->
    <!-- СИЛЬНО СЖАТА ПО ВЕРТИКАЛИ -->
    <!-- ================================================= -->

